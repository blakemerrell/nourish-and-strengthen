<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Day — dot ring hero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Fraunces:opsz,wght@9..144,600&amp;display=swap">
<style>
body{margin:0;background:#1C1916}
a{color:#E0A15A}a:hover{color:#F0BD80}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1C1916; color: #EDE6DA; font-family: 'DM Sans', system-ui, sans-serif; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<button aria-label="Previous day" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3A332C; background: transparent; cursor: pointer">‹</button>
<div style="font-size: 17px; font-weight: 700">Thu, Oct 29</div>
<button aria-label="Next day" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3A332C; background: transparent; cursor: pointer">›</button>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #A89F92">
<div style="{{d.labelStyle}}">{{d.l}}</div>
<div style="{{d.ringStyle}}"><div style="width: 26px; height: 26px; border-radius: 50%; background: #1C1916"></div></div>
<div style="{{d.labelStyle}}">{{d.n}}</div>
</div>
</sc-for>
</div>

<button onClick="{{toggle}}" aria-expanded="{{open}}" style="width: 100%; text-align: left; background: #24201C; border: 1px solid #3A332C; border-radius: 20px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 14px; width: 100%">
<div style="position: relative; width: 150px; height: 150px; flex: none">
<sc-for list="{{dots}}" as="p" hint-placeholder-count="60"><div style="{{p.style}}"></div></sc-for>
<div style="position: absolute; left: 21px; top: 21px; width: 108px; height: 108px; border-radius: 50%; background: conic-gradient(#6FB3E0 0 60%, #3A332C 60% 100%); display: flex; align-items: center; justify-content: center">
<div style="width: 100px; height: 100px; border-radius: 50%; background: #24201C; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 600; line-height: 1">1,338</div>
<div style="font-size: 12px; color: #A89F92; margin-top: 2px">of 1,413 kcal</div>
<div style="font-size: 12px; color: #6FB3E0; margin-top: 4px">1.8 / 3 L</div>
</div>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #7CC48A; font-weight: 700">P</span><span>160<span style="color: #A89F92"> / 171</span></span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #E0A15A; font-weight: 700">F</span><span>57<span style="color: #A89F92"> / 61</span></span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #A99BE0; font-weight: 700">C</span><span>47<span style="color: #A89F92"> / 45</span></span></div>
<div style="display: flex; justify-content: space-between; margin-top: 6px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E0A15A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Fibre low" style="filter: drop-shadow(0 0 5px #E0A15A)"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19l8-8"/></svg>
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E0A15A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Salt near ceiling" style="filter: drop-shadow(0 0 5px #E0A15A)"><path d="M8 10h8l-1 10H9z"/><path d="M8 10c0-3 2-6 4-6s4 3 4 6"/><path d="M11 7h.01M13 7h.01"/></svg>
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7CC48A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Workout done" style="filter: drop-shadow(0 0 5px #7CC48A)"><path d="M3 12h18M6 8v8M18 8v8M3 10v4M21 10v4"/></svg>
</div>
</div>
</div>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #3A332C; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; width: 100%">
<div style="display: flex; justify-content: space-between"><span>Fibre</span><span style="color: #E0A15A">7 g · 13 short of floor</span></div>
<div style="display: flex; justify-content: space-between"><span>Salt</span><span style="color: #E0A15A">2,274 mg · 26 under ceiling</span></div>
<div style="display: flex; justify-content: space-between"><span>Water</span><span style="color: #6FB3E0">1.8 L · 1.2 L to go</span></div>
<div style="display: flex; justify-content: space-between"><span>Left today</span><span style="color: #A89F92">75 kcal · 11 g P · 4 g F</span></div>
</div>
</sc-if>
<div style="font-size: 12px; color: #A89F92; text-align: center; width: 100%">{{hint}}</div>
</button>

<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{meals}}" as="m" hint-placeholder-count="5">
<div style="{{m.rowStyle}}">
<div style="{{m.checkStyle}}">✓</div>
<div style="flex: 1; font-size: 14px; font-weight: 700; letter-spacing: 0.06em">{{m.name}}</div>
<div style="font-size: 13px; color: #A89F92">{{m.kcal}}</div>
<div style="display: flex; gap: 4px"><div style="{{m.d1}}"></div><div style="{{m.d2}}"></div><div style="{{m.d3}}"></div><div style="{{m.d4}}"></div></div>
</div>
</sc-for>
</div>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding-bottom: 20px">
<button style="height: 52px; border-radius: 14px; border: 1px solid #3A332C; background: transparent; font-size: 13px; cursor: pointer">Rebalance</button>
<button style="height: 52px; border-radius: 14px; border: 1px solid #3A332C; background: transparent; font-size: 13px; cursor: pointer">Sweep</button>
<button style="height: 52px; border-radius: 14px; border: 1px solid #3A332C; background: transparent; font-size: 13px; cursor: pointer">Add meal</button>
<button style="height: 52px; border-radius: 14px; border: none; background: #C9A27A; color: #1C1916; font-size: 13px; font-weight: 700; cursor: pointer">Complete</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: false }; }
  renderVals() {
    const P = '#7CC48A', F = '#E0A15A', C = '#A99BE0', OFF = '#3A332C';
    const plan = [['P', 0.48, P], ['F', 0.39, F], ['C', 0.13, C]];
    const prog = { P: 0.94, F: 0.93, C: 1 };
    const n = 60, d = 5, size = 150, slots = n + 3;
    const r = (size - d) / 2, c = size / 2;
    const dots = [];
    let i = 0, used = 0;
    plan.forEach(([k, sh, col], si) => {
      const cnt = si === 2 ? n - used : Math.round(n * sh);
      used += cnt;
      const lit = Math.round(cnt * Math.min(prog[k], 1));
      for (let j = 0; j < cnt; j++, i++) {
        const a = (i / slots) * 2 * Math.PI - Math.PI / 2;
        dots.push({ style: 'position:absolute;left:' + (c + r * Math.cos(a) - d / 2).toFixed(1) + 'px;top:' + (c + r * Math.sin(a) - d / 2).toFixed(1) + 'px;width:' + d + 'px;height:' + d + 'px;border-radius:50%;background:' + (j < lit ? col : OFF) });
      }
      i++;
    });
    const mini = (p) => {
      if (!p) return 'width:34px;height:34px;border-radius:50%;box-sizing:border-box;border:1px dashed #3A332C;display:flex;align-items:center;justify-content:center';
      const seg = (s, e, f, col) => col + ' ' + s + '% ' + (s + (e - s) * f) + '%, ' + OFF + ' ' + (s + (e - s) * f) + '% ' + e + '%';
      return 'width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(' + seg(0, 47, p[0], P) + ', #1C1916 47% 49%, ' + seg(49, 86, p[1], F) + ', #1C1916 86% 88%, ' + seg(88, 99, p[2], C) + ', #1C1916 99% 100%)';
    };
    const days = [['M', 26, [1, 1, 1]], ['T', 27, [0.9, 0.7, 0.8]], ['W', 28, [1, 0.95, 1]], ['T', 29, [0.94, 0.93, 1]], ['F', 30, null], ['S', 31, null], ['S', 1, null]];
    const week = days.map((x, k) => ({ l: x[0], n: x[1], ringStyle: mini(x[2]), labelStyle: k === 3 ? 'color:#EDE6DA;font-weight:700' : '' }));
    const dot = (col) => 'width:8px;height:8px;border-radius:50%;background:' + col;
    const row = 'display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:14px;background:#24201C;border:1px solid #3A332C';
    const chk = 'width:28px;height:28px;border-radius:50%;background:#7CC48A;color:#1C1916;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700';
    const meals = [
      ['WAKE UP', '180', P, P, P, P], ['BREAKFAST · skipped', '—', OFF, OFF, OFF, OFF], ['SNACKS', '210', OFF, OFF, OFF, P],
      ['LUNCH', '420', F, P, F, F], ['DINNER', '388', P, P, P, P], ['EVENING SNACK', '140', F, P, F, F]
    ].map((m) => ({ name: m[0], kcal: m[1], rowStyle: m[1] === '—' ? row + ';opacity:.55' : row, checkStyle: m[1] === '—' ? chk.replace('#7CC48A', '#3A332C') : chk, d1: dot(m[2]), d2: dot(m[3]), d3: dot(m[4]), d4: dot(m[5]) }));
    return { dots, week, meals, open: this.state.open, toggle: () => this.setState({ open: !this.state.open }), hint: this.state.open ? 'Tap to collapse' : 'Tap for details' };
  }
}
</script>
</body>
</html>
