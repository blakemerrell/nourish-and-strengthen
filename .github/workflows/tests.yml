# Every push and pull request runs the checks a contributor would run by hand,
# against the site as it will be published rather than the files as written.
#
# There was nothing here once, and the result was on main: eleven pushes whose
# version no longer matched the files, one of them a deploy that changed
# app.js and left sw.js untouched, so phones kept the old app from their
# cache. The version is computed at build time now (tools/build-site.js), so
# that particular mistake can no longer be made; what is checked instead is
# that the build does what it says, and that a phone moves from one build to
# the next cleanly. Both run on _site/, the directory the deploy publishes, so
# what is tested is what ships — minified, versioned, and without the files
# that stay in the repository.
#
# Two jobs. The gate is quick: every script parses, the site builds, and the
# offline and updating suites pass against it. The full suite takes about ten
# minutes and blocks too; it includes the printed books, so a recipe change
# pushed without `npm run print` fails here rather than at a print shop.
#
# This workflow deploys nothing and needs no secrets; deploy.yml publishes the
# site and rules.yml the security rules.
# The live-Firebase tests (sync*) are not in the default run and not run here.
#
# The security rules are checked in a job of their own, against Google's
# Firestore emulator (tests/rules/): this is the only place they run before
# they are live, which rules.yml makes them on main once the same check
# passes there. The same job then runs src/sync.js itself under them, with
# the Firebase client the app ships, so a rule that refuses something the app
# does fails here rather than on everybody's phone. It needs Java and
# packages the app does not, so it keeps its own folder.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Build, then offline and updating
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every script parses
        run: for f in src/*.js sw.js tools/*.js tests/*.js; do node --check "$f" || exit 1; done
      # An edit to tools/walmart.js, prices.js or food-db.js pushed without
      # `npm run build` used to ship last week's prices and pack sizes, with
      # every check green. The data is rebuilt here and has to come out the
      # same as what is committed.
      - name: The committed data is what the tools build
        run: node tools/build-data.js > /dev/null && git diff --exit-code --stat -- data AUDIT.md
      - name: Build the site
        run: node tools/build-site.js
      - run: npx playwright install --with-deps chromium
      - name: Offline and updating, on the built site
        run: SITE=_site FAST=1 node tests/run.js offline upgrade

  full:
    name: Full suite, on the built site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site
        run: node tools/build-site.js
      - run: npx playwright install --with-deps chromium
      - run: SITE=_site FAST=1 node tests/run.js

  rules:
    name: Security rules and sync, against the Firestore emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/rules/.emulator
          key: firestore-emulator-1.19.8
      - run: npm ci
      - run: npm test
